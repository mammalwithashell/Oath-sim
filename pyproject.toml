[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "oath-rl"
version = "0.2.0"
description = "Oath: Chronicles of Empire & Exile — Rust RL Simulator, IS-MCTS, LSTM Trainer & Replay Lab"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "maturin>=1.7",
]

[tool.maturin]
manifest-path = "crates/oath-py/Cargo.toml"
module-name = "oath_rs"

[tool.pytest.ini_options]
testpaths = ["tests"]
